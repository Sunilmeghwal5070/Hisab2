name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: []

jobs:
  build-and-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VERSION"
          JAVA_MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F'.' '{print $1}')
          if [ "$JAVA_MAJOR_VERSION" = "1" ]; then
            JAVA_MAJOR_VERSION=$(echo "$JAVA_VERSION" | awk -F'.' '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ] || [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Detected: $JAVA_MAJOR_VERSION"
            exit 1
          fi
          echo "Java version verification passed (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore confirmed present."
          else
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found at $APK_PATH. Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK verification passed: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p build/release_asset
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUMBER="${{ github.run_number }}"
          ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          DEST_PATH="build/release_asset/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Release asset could not be prepared."
            exit 1
          fi
          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset missing or empty."
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          echo "Creating release with tag $TAG_NAME..."
          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Automatically generated debug APK built by GitHub Actions.
            - Run Number: ${{ github.run_number }}
            - Run Attempt: ${{ github.run_attempt }}
            - Commit SHA: ${{ github.sha }}
            - Note: For testing purposes only. Signed with temporary debug keystore."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          echo "APK Build: SUCCESS"
          echo "Actions Artifact: app-debug-apk uploaded successfully"
          
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "Release Publishing: SUCCESS"
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: ${{ steps.prepare_asset.outputs.asset_name }}"
            echo "### GitHub Release Successful 🚀" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK has been successfully published to GitHub Releases:" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Release URL**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset File**: \`${{ steps.prepare_asset.outputs.asset_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK directly from the release **Assets** section. The normal Actions artifact \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "Release Publishing: WARNING / FAILED (Artifact is intact)"
            echo "### GitHub Release Warning ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK build and artifact upload succeeded, but GitHub Release publishing failed or was skipped." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact \`app-debug-apk\` remains safely available for download." >> $GITHUB_STEP_SUMMARY
          fi
